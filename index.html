<!DOCTYPE html>
<html>
<head>
  <title>Wallet Connect Test</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
</head>
<body style="background:#111; color:#eee; text-align:center; font-family:sans-serif; padding:50px;">
  <h1>Wallet Connect Demo</h1>
  <button id="connectBtn" style="padding:15px 30px; font-size:16px; cursor:pointer;">CONNECT WALLET</button>
  <p id="status"></p>

  <script>
    async function connectWallet() {
      try {
        if (!window.ethereum) {
          document.getElementById('status').innerText = "MetaMask не найден!";
          return;
        }
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();
        const address = await signer.getAddress();
        document.getElementById('status').innerText = "Connected: " + address;
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = "Ошибка: " + err.message;
      }
    }

    document.getElementById('connectBtn').onclick = connectWallet;
  </script>
</body>
</html>
