<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Clicker</title>
    <!-- Telegram Mini App Script -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
            width: 85%;
            max-width: 400px;
            border: 1px solid #333;
        }
        .click-button {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #00aaff 0%, #006699 100%);
            border-radius: 50%;
            margin: 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, box-shadow 0.1s;
            border: 6px solid #ffffff11;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
        }
        .click-button:active {
            transform: scale(0.92);
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
        }
        .stat { font-size: 16px; margin: 12px 0; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .balance { font-size: 42px; font-weight: bold; color: #00aaff; text-shadow: 0 0 15px rgba(0, 170, 255, 0.4); }
        .highlight { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome, <span id="user-name" style="color: #00aaff;">Player</span>!</h2>
        <div class="stat">NFT Key: <span class="highlight">Level 1</span></div>
        <div class="balance" id="score">0</div>
        <div class="stat">Fan Tokens</div>
        
        <div class="click-button" onclick="handleButtonClick()">💎</div>
        
        <div class="stat">Tap the crystal to earn!</div>
    </div>

    <script>
        // Init Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();

        // Get User Name from Telegram
        const userName = tg.initDataUnsafe.user?.first_name || "Guest";
        document.getElementById('user-name').innerText = userName;

        let count = 0;
        function handleButtonClick() {
            count++;
            document.getElementById('score').innerText = count.toLocaleString();
            
            // Haptic Feedback for mobile
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
