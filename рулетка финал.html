<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Mechanism | SAGC Ecosystem</title>
    <!-- Stable Web3 Library -->
    <script src="https://cdnjs.cloudflare.com"></script>
    
    <style>
        body {
            background: radial-gradient(circle, #1a0f00 0%, #000 100%);
            color: #ffd700;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Golden Artifact Core */
        #mechanism {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: url('https://cloudflare-ipfs.com') center/cover;
            box-shadow: 0 0 60px #ffaa00, inset 0 0 30px #fff700;
            animation: pulse 4s infinite ease-in-out;
            cursor: pointer;
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.3); }
        }

        .stats-box {
            margin-top: 20px;
            background: rgba(20, 10, 0, 0.9);
            border: 1px solid #ffd700;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 330px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            z-index: 5;
            backdrop-filter: blur(5px);
        }

        .btn-main {
            background: linear-gradient(45deg, #b8860b, #ffd700);
            border: none;
            color: #000;
            padding: 15px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-main:hover { box-shadow: 0 0 25px #ffd700; transform: translateY(-2px); }
        .btn-main:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        /* Divine Spin Modal */
        #roulette-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.97);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
        }

        #wheel {
            width: 300px;
            height: 300px;
            border: 8px solid #ffd700;
            border-radius: 50%;
            background: conic-gradient(
                #221100 0% 16%, #442200 16% 32%, 
                #221100 32% 48%, #442200 48% 64%, 
                #221100 64% 80%, #ffd700 80% 100%
            );
            transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1);
            position: relative;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        .pointer {
            width: 0; height: 0; 
            border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid #fff;
            position: absolute; top: 170px; z-index: 110;
        }
    </style>
</head>
<body>

    <!-- Artifact Hub -->
    <div id="mechanism" onclick="openRoulette()"></div>

    <div class="stats-box">
        <div style="font-size: 0.85em; opacity: 0.7; letter-spacing: 1px; color: #ffd700;">GENESIS CORE STORAGE</div>
        <div id="balance" style="font-size: 2.3em; font-weight: bold; text-shadow: 0 0 15px #ffd700;">0.00 $SAGC</div>
        
        <div style="margin: 15px 0; border-top: 1px solid rgba(255,215,0,0.25);"></div>
        
        <div style="font-size: 0.85em; margin-bottom: 5px;">Power: 70 $SAGC / hr</div>
        <div id="storage-timer" style="color: #ffaa00; font-weight: bold; font-size: 1.1em;">Storage: 06:00:00</div>
        
        <button id="extract-btn" class="btn-main" onclick="extractEnergy()">EXTRACT $SAGC</button>
    </div>

    <!-- Divine Spin Modal -->
    <div id="roulette-screen">
        <h2 style="color: #ffd700; letter-spacing: 6px; text-shadow: 0 0 10px #ffd700;">DIVINE SPIN</h2>
        <div class="pointer"></div>
        <div id="wheel"></div>
        <button class="btn-main" id="spin-btn" onclick="spinWheel()" style="width: 200px; margin-top: 50px;">ACTIVATE SPIN</button>
        <button onclick="closeRoulette()" style="background:none; border:none; color:#777; margin-top:20px; cursor:pointer; font-weight: bold; text-transform: uppercase;">Back to Core</button>
    </div>

<script>
    // --- Blockchain Parameters ---
    const CLIENT_ID = "189a85cd28b975cc8a024f2be6423a07";
    const TOKEN_ADDR = "0xe56a08f3a9c6f24473d6f8a03a12e2d62409c1f9";
    const NFT_ADDR = "0x99b91cEAF77d92958682cA404255CB523EE49454";

    // --- Core Farming Logic ---
    let balance = 0;
    let secondsElapsed = 0;
    const MAX_SECONDS = 6 * 3600; // 6h Limit
    const RATE_PER_SEC = 70 / 3600; // 70 per hour

    // Auto-update Energy Core
    setInterval(() => {
        if (secondsElapsed < MAX_SECONDS) {
            secondsElapsed++;
            balance += RATE_PER_SEC;
            updateUI();
        }
    }, 1000);

    function updateUI() {
        document.getElementById('balance').innerText = balance.toFixed(2) + " $SAGC";
        let remaining = MAX_SECONDS - secondsElapsed;
        
        if (remaining <= 0) {
            document.getElementById('storage-timer').innerText = "CORE SATURATED (6H)";
            document.getElementById('storage-timer').style.color = "#ff4444";
        } else {
            let h = Math.floor(remaining / 3600).toString().padStart(2, '0');
            let m = Math.floor((remaining % 3600) / 60).toString().padStart(2, '0');
            let s = (remaining % 60).toString().padStart(2, '0');
            document.getElementById('storage-timer').innerText = `Storage: ${h}:${m}:${s}`;
        }
    }

    // --- Divine Spin Functions ---
    function openRoulette() { 
        document.getElementById('roulette-screen').style.display = 'flex'; 
    }
    
    function closeRoulette() { 
        document.getElementById('roulette-screen').style.display = 'none'; 
    }

    function spinWheel() {
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-btn');
        spinBtn.disabled = true;

        const deg = Math.floor(3600 + Math.random() * 3600); // 10+ full spins
        wheel.style.transform = `rotate(${deg}deg)`;

        setTimeout(() => {
            // Winning Logic (Ranges from 70 to 7,000 $SAGC)
            const prizePool = [70, 70, 350, 700, 1750, 3500, 7000];
            const win = prizePool[Math.floor(Math.random() * prizePool.length)];
            
            alert("DIVINE BLESSING!\nReceived: +" + win + " $SAGC");
            
            balance += win;
            updateUI();
            
            spinBtn.disabled = false;
            closeRoulette();
            
            // Reset wheel
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            setTimeout(() => { wheel.style.transition = 'transform 4s cubic-bezier(0.1, 0, 0.1, 1)'; }, 50);
        }, 4100);
    }

    // --- Extraction (Web3 Connect) ---
    async function extractEnergy() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                alert("Vault Linked: " + accounts[0].substring(0,6) + "...\nInitializing $SAGC Transfer...");
            } catch (e) {
                alert("Please unlock your Divine Vault (MetaMask)!");
            }
        } else {
            alert("Ancient Wallet not detected!");
        }
    }
</script>
</body>
</html>
